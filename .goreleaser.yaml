# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2
project_name: hostlink

git:
  # An RC tag is a release note of its own. Ignore RC tags when finding the
  # previous tag so both the RC and the final release list everything since the
  # last stable release, instead of the final only listing the rc.N delta.
  ignore_tags:
    - "*-rc.*"

builds:
  - id: hostlink
    binary: hostlink
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X hostlink/version.Version={{.Version}}

  - id: hlctl
    binary: hlctl
    main: ./cmd/hlctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X hostlink/version.Version={{.Version}}

archives:
  - id: hostlink-archive
    ids: [hostlink]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - src: "scripts/**/*"
        dst: scripts
        strip_parent: true

  - id: hlctl-archive
    ids: [hlctl]
    formats: [tar.gz]
    name_template: >-
      hlctl_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  # A vX.Y.Z-rc.N tag becomes a GitHub prerelease, so /releases/latest never
  # returns it. Final tags remain full releases.
  prerelease: auto
  # Repo policy (AGENTS.md): new releases MUST NOT become latest automatically.
  # Promote a final release only after the pipeline succeeds:
  # gh release edit <tag> --latest. RCs are never promoted.
  make_latest: false
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
