# .github/workflows/sqlrelay-image.yml
#
# Publishes the SQL stream relay (cmd/sqlrelay) as ghcr.io/selfhost-dev/sqlrelay:<tag>, built from
# dockers/sqlrelay.Dockerfile, so the selfhost backend can run it as a Kamal accessory
# (docs/sql-stream.md). Separate from release.yml on purpose: a failed image build must not fail
# a release's asset checks or its promotion to latest.
#
# Runs on every release tag (RCs too) and by hand for a tag that already exists (v0.8.64 shipped
# before this workflow). It never pushes a `latest` tag: consumers pin the hostlink tag.
name: sqlrelay-image

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build, e.g. v0.8.64"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: sqlrelay-image-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag is a release tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::'$TAG' is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N" >&2
            exit 1
          fi

      - name: Checkout the tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The source label links the package to this repo, so it inherits the repo's access.
      # amd64 only: the QA and production web boxes are amd64 (selfhost's builder.arch).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockers/sqlrelay.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/selfhost-dev/sqlrelay:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ github.sha }}
