name: Test

on:
  pull_request:
    branches: [main]

jobs:
  test:
    # Fork PRs must never reach the shared Hetzner host: run them on sandboxed GitHub runners.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'hetzner' }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run unit tests
        run: make test

      - name: Run integration tests
        run: make test-it
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          TESTCONTAINERS_RYUK_DISABLED: "true"
